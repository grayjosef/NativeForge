# The portability escape test, written down and runnable.
#
# If NativeForge can only start on Railway, it is not portable - it is hosted.
# This file is the proof that it can: `docker compose up --build` gives the
# complete runtime (PostgreSQL 16 + the app, migrated from zero) on any machine
# with a container runtime, using no provider API, no provider CLI, and no
# account anywhere.
#
# It is also the local integration lane. The default development lane is still
# SQLite, which has no row-level security at all and therefore cannot exercise
# the tenant boundary. This can.

name: nativeforge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nativeforge
      POSTGRES_PASSWORD: nativeforge
      POSTGRES_DB: nativeforge
    ports:
      # Exposed for psql and the isolation gate. The app reaches it on the
      # compose network and does not need this.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nativeforge -d nativeforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped from the working tree so a local image reports honestly.
        # Falls back to "unknown" rather than lying when git is unavailable.
        NF_GIT_SHA: ${NF_GIT_SHA:-unknown}
        NF_SOURCE_DIRTY: ${NF_SOURCE_DIRTY:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://nativeforge:nativeforge@postgres:5432/nativeforge
      # Local credentials for a throwaway container on a private network.
      # Nothing here is a secret for anything that outlives `compose down`.
      NF_PUBLIC_ORIGIN: http://localhost:8000
      # Stays false. This header names the tenant every RLS policy reads and
      # nothing authenticates it; the demo lane turns it on explicitly.
      NF_DEV_ORG_HEADERS: "false"
    ports:
      # Overridable: the workstation development lane already binds 8000, and
      # WSL forwards that to the Windows host, so a fixed mapping collides.
      - "127.0.0.1:${NF_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
