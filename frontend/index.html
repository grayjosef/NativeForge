<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NativeForge — evidence-backed Native-relevant grant intelligence and pursuit workflow for tribal organizations and Native nonprofits."
    />
    <title>NativeForge — Native Grant Intelligence &amp; Pursuit</title>

    <!-- Brand marks. The SVG is the source of truth and modern browsers
         prefer it; the PNGs exist for the ones that do not, and for iOS.
         All of them are generated by scripts/build_brand_assets.py, so a
         change to the mark cannot leave a stale favicon behind. -->
    <link rel="icon" href="/brand/nf-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />

    <!-- Paint the field before React mounts, so a reload does not flash
         white on a dark-mode machine. Matches --nf-page in index.css. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8f7f3"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0d1310"
    />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NativeForge" />
    <meta
      property="og:description"
      content="Grant intelligence, pursuit, and award compliance for Tribal governments."
    />
    <meta property="og:image" content="/brand/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Inlined because it must apply before index.css has loaded; without
         it a dark-mode reload flashes a white page for a frame. */
      :root {
        color-scheme: light dark;
      }
      html {
        background: #f8f7f3;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0d1310;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
